name: TiffinTales
options:
  bundleIdPrefix: com.vedagames
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TiffinTales:
    type: application
    platform: iOS
    sources:
      - path: TiffinTales
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vedagames.tiffintales
        PRODUCT_NAME: Tiffin Tales
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tiffin Tales
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.educational-games
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record grandparents and parents sharing family food wisdom. Recordings stay on this device.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  TiffinTales:
    build:
      targets:
        TiffinTales: all
    run:
      config: Debug
