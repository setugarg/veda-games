name: iOS build

on:
  push:
    paths:
      - "TiffinTales/**"
      - "TiffinTales.xcodeproj/**"
      - "Tools/**"
      - "PackTemplates/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tiffin Tales (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Content check
        run: |
          swiftc -parse-as-library TiffinTales/Models/*.swift TiffinTales/Content/*.swift \
            TiffinTales/Engine/*.swift Tools/ContentCheck.swift -o "$RUNNER_TEMP/content-check"
          "$RUNNER_TEMP/content-check" TiffinTales/Resources/Packs

      - name: Build app
        run: |
          status=0
          xcodebuild -project TiffinTales.xcodeproj -target TiffinTales \
            -sdk iphonesimulator -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || status=$?
          tail -5 "$RUNNER_TEMP/build.log"
          echo "=== UNIQUE ERRORS ==="
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -150 || true
          {
            echo "### Build errors"
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -100 || echo "None 🎉"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Check packs were bundled
        run: |
          app=$(find build -name "*.app" -maxdepth 3 | head -1)
          echo "App: $app"
          count=$(find "$app" -name "kitchen-*.json" | wc -l)
          echo "Kitchen packs in bundle: $count"
          test "$count" -gt 10

      - name: Screenshot every screen in the simulator
        timeout-minutes: 15
        run: |
          # Every simulator command gets a hard time limit so one hang can't stall the job.
          limit() { local seconds=$1; shift; perl -e 'alarm shift; exec @ARGV' "$seconds" "$@"; }
          app=$(find build -name "*.app" -maxdepth 3 | head -1)
          echo "App: $app"
          echo "::group::Simulator runtimes"
          xcrun simctl list runtimes
          echo "::endgroup::"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items()) if "iOS" in runtime for d in ds
                    if d["name"].startswith("iPhone") and "Pro Max" not in d["name"] and "Plus" not in d["name"]]
          print(phones[-1]["udid"] if phones else "")')
          test -n "$udid" || { echo "No iPhone simulator available"; exit 1; }
          echo "Simulator: $udid"
          echo "Booting…"
          limit 240 xcrun simctl boot "$udid" || echo "boot returned $?"
          for i in $(seq 1 60); do
            state=$(xcrun simctl list devices -j | python3 -c "import json,sys; print([d['state'] for ds in json.load(sys.stdin)['devices'].values() for d in ds if d['udid']=='$udid'][0])")
            [ "$state" = "Booted" ] && break
            sleep 5
          done
          echo "State: $state"
          sleep 20  # let SpringBoard settle
          limit 30 xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          echo "Installing…"
          limit 180 xcrun simctl install "$udid" "$app"
          bundle=com.vedagames.tiffintales
          mkdir -p shots
          shoot() {  # name locale
            limit 30 xcrun simctl terminate "$udid" $bundle 2>/dev/null || true
            limit 60 xcrun simctl launch "$udid" $bundle -screen "$1" -AppleLocale "$2" -AppleLanguages "(en)" > /dev/null || echo "launch failed for $1"
            sleep 6
            limit 30 xcrun simctl io "$udid" screenshot "shots/$1-$2.png" > /dev/null || echo "screenshot failed for $1"
            echo "📸 $1 ($2)"
          }
          for screen in welcome home chapter intro play-meal play-remedy play-wisdom play-elder wisdom-book nutrient-book remedy-book pantry settings family-dish family-remedy; do
            shoot "$screen" en_IN
          done
          shoot home en_BR
          shoot home en_KE
          shoot play-wisdom en_MX
          limit 60 xcrun simctl spawn "$udid" log show --last 5m --predicate 'process CONTAINS "Tiffin"' --style compact > shots/app-log.txt 2>/dev/null || true
          ls -la shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14
