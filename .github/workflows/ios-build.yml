name: iOS build

on:
  push:
    paths:
      - "TiffinTales/**"
      - "TiffinTales.xcodeproj/**"
      - "Tools/**"
      - "PackTemplates/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tiffin Tales (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Content check
        run: |
          swiftc -parse-as-library TiffinTales/Models/*.swift TiffinTales/Content/*.swift \
            TiffinTales/Engine/*.swift Tools/ContentCheck.swift -o "$RUNNER_TEMP/content-check"
          "$RUNNER_TEMP/content-check" TiffinTales/Resources/Packs

      - name: Build app
        run: |
          status=0
          xcodebuild -project TiffinTales.xcodeproj -target TiffinTales \
            -sdk iphonesimulator -configuration Debug ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || status=$?
          tail -5 "$RUNNER_TEMP/build.log"
          echo "=== UNIQUE ERRORS ==="
          grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -150 || true
          {
            echo "### Build errors"
            grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -100 || echo "None 🎉"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Check packs were bundled
        run: |
          app=$(find build -name "*.app" -maxdepth 3 | head -1)
          echo "App: $app"
          count=$(find "$app" -name "kitchen-*.json" | wc -l)
          echo "Kitchen packs in bundle: $count"
          test "$count" -gt 10

      - name: Screenshot every screen in the simulator
        run: |
          app=$(find build -name "*.app" -maxdepth 3 | head -1)
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone") and "Pro Max" not in d["name"]]
          print(phones[-1]["udid"])')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$udid" "$app"
          bundle=com.vedagames.tiffintales
          mkdir -p shots
          shoot() {  # name locale
            xcrun simctl terminate "$udid" $bundle 2>/dev/null || true
            xcrun simctl launch "$udid" $bundle -screen "$1" -AppleLocale "$2" -AppleLanguages "(en)" > /dev/null
            sleep 5
            xcrun simctl io "$udid" screenshot "shots/$1-$2.png" > /dev/null
            echo "📸 $1 ($2)"
          }
          for screen in welcome home chapter intro play-meal play-remedy play-wisdom play-elder wisdom-book nutrient-book remedy-book pantry settings family-dish family-remedy; do
            shoot "$screen" en_IN
          done
          shoot home en_BR
          shoot home en_KE
          shoot play-wisdom en_MX
          xcrun simctl spawn "$udid" log show --last 3m --predicate 'process == "Tiffin Tales" AND messageType == fault' > shots/faults.txt 2>/dev/null || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14
